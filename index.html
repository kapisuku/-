<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงเวลาปฏิบัติงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #222232;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #333344;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid #333344;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b0c0;
        }
        select {
            width: 100%;
            padding: 12px;
            background-color: #161622;
            border: 1px solid #4a4a6a;
            border-radius: 8px;
            color: #fff;
            font-family: 'Kanit', sans-serif;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            appearance: none;
        }
        select:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.5);
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: 'Kanit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-in {
            background-color: #00b894;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }
        .btn-in:hover { background-color: #019e7f; }
        .btn-out {
            background-color: #d63031;
            box-shadow: 0 4px 15px rgba(214, 48, 49, 0.3);
        }
        .btn-out:hover { background-color: #b82929; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ลงเวลาปฏิบัติงาน</h2>
        
        <div class="form-group">
            <label>ชื่อ - นามสกุล (ช่าง):</label>
            <select id="mechanicName">
                <option value="" disabled selected>กำลังโหลดรายชื่อ...</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn-in" onclick="recordTime('เข้าเวร')">เข้าเวร</button>
            <button class="btn-out" onclick="recordTime('ออกเวร')">ออกเวร</button>
        </div>
    </div>

    <script>
        // อัปเดต URL เป็นของคุณเรียบร้อยแล้ว
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzdgWj-zf4U47o9hHrC_bDw7AMdZFjdLH6ny0j3YsfAHnF3aBEgFJ9M5Wyeoh09Ru44gw/exec';

        window.onload = function() {
            fetch(scriptURL + '?action=getNames')
                .then(response => response.json())
                .then(data => {
                    const select = document.getElementById('mechanicName');
                    select.innerHTML = '<option value="" disabled selected>ระบุชื่อช่าง...</option>';
                    data.names.forEach(name => {
                        let option = document.createElement('option');
                        option.value = name;
                        option.textContent = name;
                        select.appendChild(option);
                    });
                })
                .catch(error => console.error('Error loading names:', error));
        };

        function recordTime(actionType) {
            const name = document.getElementById('mechanicName').value;
            
            if (!name) {
                alert('กรุณาเลือกชื่อก่อนบันทึกเวลา');
                return;
            }

            document.querySelector('.btn-in').disabled = true;
            document.querySelector('.btn-out').disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ name: name, action: actionType })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('✅ ' + data.msg);
                    document.getElementById('mechanicName').value = ""; 
                } else {
                    alert('⚠️ ' + data.msg); 
                }
            })
            .catch(error => {
                alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อกับระบบ');
                console.error('Error:', error);
            })
            .finally(() => {
                document.querySelector('.btn-in').disabled = false;
                document.querySelector('.btn-out').disabled = false;
            });
        }
    </script>
</body>
</html>
