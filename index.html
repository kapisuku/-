<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงเวลาปฏิบัติงาน | Summer City</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --summer-orange: #FF5E3A;
            --summer-orange-glow: rgba(255, 94, 58, 0.4);
            --summer-blue: #00D2FF;
            --summer-blue-glow: rgba(0, 210, 255, 0.4);
            --summer-green: #00E676;
            --card-bg: #16161C; 
            --bg-dark: #0B0B0E; 
            --text-light: #EAEAEA;
            --border-color: #262630;
        }
        body {
            font-family: 'Kanit', sans-serif;
            margin: 0; padding: 0;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-light);
            background-image: radial-gradient(circle at 50% 0%, #1a1a24 0%, transparent 70%);
        }
        header {
            background: rgba(11, 11, 14, 0.85);
            backdrop-filter: blur(12px);
            padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }
        header h1 {
            margin: 0; color: #fff; font-size: 24px; font-weight: 800;
            display: flex; align-items: center; gap: 10px;
            text-shadow: 0 0 15px var(--summer-orange-glow);
            letter-spacing: 1px; cursor: pointer; user-select: none;
        }
        .tab-menu { display: flex; gap: 12px; }
        .tab-btn {
            background: transparent; color: #888; border: 1px solid transparent;
            padding: 8px 20px; border-radius: 8px; font-family: 'Kanit'; 
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active {
            background: rgba(255, 94, 58, 0.1); border-color: var(--summer-orange); 
            color: var(--summer-orange); box-shadow: 0 0 15px var(--summer-orange-glow) inset;
        }
        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .page { display: none; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .page.active { display: flex; gap: 30px; flex-wrap: wrap; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card {
            background-color: var(--card-bg); padding: 40px; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); border: 1px solid var(--border-color);
            flex: 1; min-width: 400px; display: flex; flex-direction: column;
        }
        h2 { margin-top: 0; font-size: 24px; color: var(--summer-blue); font-weight: 800; }
        .header-title-container {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px;
        }
        .form-group { margin-bottom: 30px; }
        label { display: block; margin-bottom: 12px; font-size: 16px; color: #aaa; }
        select {
            width: 100%; padding: 15px; background-color: #0F0F13;
            border: 1px solid #333; border-radius: 8px; color: #fff;
            font-family: 'Kanit'; font-size: 16px; outline: none; transition: 0.3s;
        }
        select:focus { border-color: var(--summer-orange); box-shadow: 0 0 10px var(--summer-orange-glow); }
        .btn-group { display: flex; gap: 15px; }
        button.action-btn {
            flex: 1; padding: 15px; border: none; border-radius: 8px;
            font-family: 'Kanit'; font-size: 18px; font-weight: 800;
            color: white; cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .btn-in { background: linear-gradient(135deg, #00C9FF, #0082FF); box-shadow: 0 4px 15px var(--summer-blue-glow); }
        .btn-in:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-2px); }
        .btn-out { background: linear-gradient(135deg, #ff4757, #c0392b); box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); }
        .btn-out:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-2px); }
        button:disabled { 
            background: #2a2a3e !important; color: #666; box-shadow: none !important; 
            cursor: not-allowed; transform: none !important; 
        }
        .manage-btn {
            padding: 8px 16px; font-size: 14px; border: none; border-radius: 6px;
            font-family: 'Kanit'; font-weight: 600; cursor: pointer; transition: 0.3s; color: #fff;
        }
        .btn-export { background-color: #2980b9; }
        .btn-export:hover { background-color: #3498db; transform: translateY(-2px); }
        .btn-reset { background-color: transparent; border: 1px solid #c0392b; color: #ff4757; }
        .btn-reset:hover { background-color: #c0392b; color: #fff; transform: translateY(-2px); }
        .status-container { flex: 1; overflow-y: auto; padding-right: 15px; max-height: 60vh; }
        .status-container::-webkit-scrollbar { width: 6px; }
        .status-container::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .status-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 10px;
        }
        .user-name { font-size: 20px; font-weight: 600; color: #fff; }
        .status-indicator { display: flex; align-items: center; gap: 12px; }
        .status-text { font-size: 16px; font-weight: 600; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-online { background-color: var(--summer-green); box-shadow: 0 0 12px rgba(0, 230, 118, 0.7); }
        .dot-offline { background-color: #444; }
        .time-in { font-size: 16px; color: var(--summer-green); font-weight: 600; min-width: 50px; text-align: right; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 16px; }
        th { background: rgba(0,0,0,0.3); color: var(--summer-orange); font-weight: 800; text-transform: uppercase; }
        td { color: #d0d0d0; }
        .summary-card { width: 100%; flex: none; }
    </style>
</head>
<body>

    <header>
        <h1>
            <span style="color: var(--summer-orange);">🌴 SUMMER CITY</span> 
            <span style="font-size: 16px; font-weight: 400; color: #888; text-shadow: none;">| ระบบลงเวลาช่าง</span>
        </h1>
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchPage('time')">⏱️ ลงเวลา</button>
            <button class="tab-btn" onclick="switchPage('summary')">📊 สรุปเวลาเข้าเวร</button>
        </div>
    </header>

    <div class="container">
        <!-- หน้า 1: ลงเวลา -->
        <div id="timePage" class="page active">
            <div class="card">
                <div class="header-title-container">
                    <h2 style="margin:0; border:none; padding:0;">📝 ลงเวลาปฏิบัติงาน</h2>
                </div>
                <div class="form-group">
                    <label>ชื่อ - นามสกุล (ช่าง):</label>
                    <select id="mechanicName" onchange="updateButtonState()">
                        <option value="" disabled selected>กำลังโหลดข้อมูล...</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="action-btn btn-in" id="btnIn" onclick="recordTime('เข้าเวร')">เข้าเวร</button>
                    <button class="action-btn btn-out" id="btnOut" onclick="recordTime('ออกเวร')">ออกเวร</button>
                </div>
            </div>

            <div class="card">
                <div class="header-title-container">
                    <h2 style="margin:0; border:none; padding:0; color:var(--summer-green);">🟢 สถานะการเข้าเวร</h2>
                </div>
                <div class="status-container" id="statusList">
                    <div style="color: #888; text-align: center; margin-top: 30px;">กำลังอัปเดตสถานะล่าสุด...</div>
                </div>
            </div>
        </div>

        <!-- หน้า 2: สรุปเวลา -->
        <div id="summaryPage" class="page">
            <div class="card summary-card">
                <div class="header-title-container">
                    <h2 style="margin:0; border:none; padding:0;">📊 สรุปเวลาการทำงาน</h2>
                    <div style="display:flex; gap: 10px;">
                        <button class="manage-btn btn-export" onclick="exportSummary()">📤 คัดลอกสรุปส่งงาน</button>
                        <button class="manage-btn btn-reset" onclick="resetSummary()">🗑️ รีเซ็ตเวลา</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>รายชื่อช่าง</th>
                            <th>รวมเวลารายวัน</th>
                            <th>รวมเวลารายสัปดาห์</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody">
                        <tr><td colspan="3" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 📌 นำ Web App URL อันใหม่ล่าสุดมาวางที่นี่
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxB_NUh81HV0xtOYpQMyoUiNQoUzywa9ByAyOdzH8D4n2ht-RmHGfKY570lBeYxqT8zKA/exec';

        let latestData = [];

        window.onload = () => {
            loadCachedNames(); // โหลดชื่อจากความจำเครื่องขึ้นมาโชว์ทันที
            loadData(); // ดึงข้อมูลอัปเดตจาก Google แบบเบื้องหลัง
        };
        setInterval(loadData, 30000);

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId + 'Page').classList.add('active');
            event.target.classList.add('active');
            if(pageId === 'summary') renderSummary();
        }

        function loadCachedNames() {
            const cached = localStorage.getItem('summerCityNames');
            if (cached) {
                const names = JSON.parse(cached);
                populateDropdown(names);
            }
        }

        function populateDropdown(names) {
            const select = document.getElementById('mechanicName');
            const currentValue = select.value;
            
            // ป้องกันจอกระพริบถ้าชื่อมีครบอยู่แล้ว
            if (select.options.length > 1 && select.options.length === names.length + 1) return;

            select.innerHTML = '<option value="" disabled selected>ระบุชื่อช่าง...</option>';
            names.forEach(name => {
                let option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
            
            if(currentValue) {
                select.value = currentValue;
                updateButtonState();
            }
        }

        function updateButtonState() {
            const name = document.getElementById('mechanicName').value;
            const btnIn = document.getElementById('btnIn');
            const btnOut = document.getElementById('btnOut');

            if (!name) {
                btnIn.disabled = false; btnOut.disabled = false; return;
            }

            const user = latestData.find(u => u.name === name);
            if (user) {
                if (user.isOnline) {
                    btnIn.disabled = true;  
                    btnOut.disabled = false; 
                } else {
                    btnIn.disabled = false;
                    btnOut.disabled = true; 
                }
            }
        }

        function loadData() {
            if (!scriptURL || scriptURL === 'ใส่_URL_ของ_GOOGLE_APPS_SCRIPT_ที่นี่') return;

            fetch(scriptURL + '?action=getData')
                .then(response => response.json())
                .then(result => {
                    if(result.status === "error") return;
                    
                    latestData = result.data;
                    const nameList = latestData.map(u => u.name);
                    
                    // อัปเดต Cache เพื่อให้เปิดเว็บรอบหน้าเร็วขึ้น
                    localStorage.setItem('summerCityNames', JSON.stringify(nameList)); 
                    populateDropdown(nameList); 

                    // อัปเดตสถานะ On Duty / Off Duty
                    const statusList = document.getElementById('statusList');
                    statusList.innerHTML = '';
                    latestData.forEach(user => {
                        let statusHtml = `
                            <div class="status-item">
                                <div class="user-name">${user.name}</div>
                                <div class="status-indicator">
                                    <span class="status-text" style="color: ${user.isOnline ? '#00e676' : '#636e72'}">
                                        ${user.isOnline ? 'On Duty' : 'Off Duty'}
                                    </span>
                                    <div class="dot ${user.isOnline ? 'dot-online' : 'dot-offline'}"></div>
                                    ${user.isOnline ? `<span class="time-in">${user.timeInText}</span>` : `<span class="time-in" style="opacity: 0">00:00</span>`}
                                </div>
                            </div>
                        `;
                        statusList.insertAdjacentHTML('beforeend', statusHtml);
                    });

                    updateButtonState();
                    if(document.getElementById('summaryPage').classList.contains('active')) renderSummary();
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        function renderSummary() {
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            if (latestData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">ไม่มีข้อมูล</td></tr>';
                return;
            }
            latestData.forEach(user => {
                let html = `
                    <tr>
                        <td style="font-weight:bold; color:#fff;">${user.name}</td>
                        <td style="color: var(--summer-blue); font-weight: 600;">${user.todayText}</td>
                        <td style="color: var(--summer-orange); font-weight: 600;">${user.weekText}</td>
                    </tr>
                `;
                tbody.innerHTML += html;
            });
        }

        function recordTime(actionType) {
            const name = document.getElementById('mechanicName').value;
            if (!name) return alert('กรุณาเลือกชื่อก่อนบันทึกเวลา');

            document.getElementById('btnIn').disabled = true;
            document.getElementById('btnOut').disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ name: name, action: actionType })
            })
            .then(response => response.json())
            .then(data => {
                alert((data.status === 'success' ? '✅ ' : '⚠️ ') + data.msg);
                if(data.status === 'success') loadData();
                else updateButtonState();
            });
        }

        function exportSummary() {
            if (latestData.length === 0) return alert("ไม่มีข้อมูลให้คัดลอกครับ");
            let textOutput = "📊 สรุปเวลาเข้าเวร\n\n";
            latestData.forEach(user => {
                textOutput += `ช่าง: ${user.name}\nรวมเวลารายวัน: ${user.todayText}\nรวมเวลารายสัปดาห์: ${user.weekText}\n----------------------\n`;
            });
            navigator.clipboard.writeText(textOutput).then(() => {
                alert("📋 คัดลอกข้อมูลเรียบร้อย นำไปวางส่งงานได้เลย!");
            });
        }

        function resetSummary() {
            const password = prompt("⚠️ คำเตือน: ข้อมูลการเข้าออกเวรทั้งหมดจะถูกลบ!\n\nกรุณาใส่รหัสผ่านเพื่อยืนยัน:");
            if (password === "Kapi0625") {
                if (confirm("แน่ใจหรือไม่ว่าจะล้างข้อมูลทั้งหมด?")) {
                    fetch(scriptURL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'resetData' })
                    })
                    .then(r => r.json())
                    .then(data => { alert(data.msg); loadData(); })
                    .catch(e => alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อ'));
                }
            } else if (password !== null) {
                alert("❌ รหัสผ่านไม่ถูกต้อง!");
            }
        }
    </script>
</body>
</html>
