<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงเวลาปฏิบัติงาน | Summer City</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --summer-orange: #FF5E3A;
            --summer-orange-glow: rgba(255, 94, 58, 0.4);
            --summer-blue: #00D2FF;
            --summer-blue-glow: rgba(0, 210, 255, 0.4);
            --summer-green: #00E676;
            --card-bg: #16161C; 
            --bg-dark: #0B0B0E; 
            --text-light: #EAEAEA;
            --border-color: #262630;
        }

        body {
            font-family: 'Kanit', sans-serif;
            margin: 0; padding: 0;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-light);
            background-image: radial-gradient(circle at 50% 0%, #1a1a24 0%, transparent 70%);
        }

        header {
            background: rgba(11, 11, 14, 0.85);
            backdrop-filter: blur(12px);
            padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0; color: #fff; font-size: 24px; font-weight: 800;
            display: flex; align-items: center; gap: 10px;
            text-shadow: 0 0 15px var(--summer-orange-glow);
            letter-spacing: 1px; cursor: pointer; user-select: none;
        }

        .tab-menu { display: flex; gap: 12px; }
        .tab-btn {
            background: transparent; color: #888; border: 1px solid transparent;
            padding: 8px 20px; border-radius: 8px; font-family: 'Kanit'; 
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease;
        }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active {
            background: rgba(255, 94, 58, 0.1); border-color: var(--summer-orange); 
            color: var(--summer-orange); box-shadow: 0 0 15px var(--summer-orange-glow) inset;
        }

        .container { 
            max-width: 1400px; 
            margin: 40px auto; 
            padding: 0 20px; 
        }

        .page { display: none; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .page.active { display: flex; gap: 30px; flex-wrap: wrap; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            flex: 1;
            min-width: 400px;
            display: flex;
            flex-direction: column;
        }

        h2 { margin-top: 0; font-size: 24px; color: var(--summer-blue); font-weight: 800; }

        .header-title-container {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px; margin-bottom: 25px;
        }

        .form-group { margin-bottom: 30px; }
        label { display: block; margin-bottom: 12px; font-size: 16px; color: #aaa; }
        select {
            width: 100%; padding: 15px; background-color: #0F0F13;
            border: 1px solid #333; border-radius: 8px; color: #fff;
            font-family: 'Kanit'; font-size: 16px; outline: none; transition: 0.3s;
        }
        select:focus { border-color: var(--summer-orange); box-shadow: 0 0 10px var(--summer-orange-glow); }

        .btn-group { display: flex; gap: 15px; }
        button.action-btn {
            flex: 1; padding: 15px; border: none; border-radius: 8px;
            font-family: 'Kanit'; font-size: 18px; font-weight: 800;
            color: white; cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .btn-in { background: linear-gradient(135deg, #00C9FF, #0082FF); box-shadow: 0 4px 15px var(--summer-blue-glow); }
        .btn-in:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-2px); }
        .btn-out { background: linear-gradient(135deg, #ff4757, #c0392b); box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); }
        .btn-out:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-2px); }
        button:disabled { 
            background: #2a2a3e !important; color: #666; box-shadow: none !important; 
            cursor: not-allowed; transform: none !important; 
        }

        .manage-btn {
            padding: 8px 16px; font-size: 14px; border: none; border-radius: 6px;
            font-family: 'Kanit'; font-weight: 600; cursor: pointer; transition: 0.3s; color: #fff;
        }
        .btn-export { background-color: #2980b9; }
        .btn-export:hover { background-color: #3498db; transform: translateY(-2px); }
        .btn-reset { background-color: transparent; border: 1px solid #c0392b; color: #ff4757; }
        .btn-reset:hover { background-color: #c0392b; color: #fff; transform: translateY(-2px); }

        .status-container { flex: 1; overflow-y: auto; padding-right: 15px; max-height: 60vh; }
        .status-container::-webkit-scrollbar { width: 6px; }
        .status-container::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .status-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 10px;
        }
        
        .user-name { font-size: 20px; font-weight: 600; color: #fff; }
        .status-indicator { display: flex; align-items: center; gap: 12px; }
        .status-text { font-size: 16px; font-weight: 600; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-online { background-color: var(--summer-green); box-shadow: 0 0 12px rgba(0, 230, 118, 0.7); }
        .dot-offline { background-color: #444; }
        .time-in { font-size: 16px; color: var(--summer-green); font-weight: 600; min-width: 50px; text-align: right; }
        
        .loading-text { font-size: 14px; color: #888; margin-left: 10px; display: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 16px; }
        th { background: rgba(0,0,0,0.3); color: var(--summer-orange); font-weight: 800; text-transform: uppercase; }
        td { color: #d0d0d0; }
        .summary-card { width: 100%; flex: none; }

        /* CSS สำหรับมินิเกม */
        .minigame-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px 0;
            user-select: none;
        }
        .game-container {
            position: relative;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #222;
            border-radius: 12px;
            padding: 40px 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(20, 20, 20, 0.95);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        .overlay h2 { margin: 0 0 10px; color: #ffaa00; font-size: 24px; border: none; padding: 0; }
        .overlay p { font-size: 14px; color: #aaa; margin-bottom: 20px; line-height: 1.5; }

        .game-btn-group { display: flex; flex-direction: column; gap: 10px; width: 80%; }
        .game-btn {
            border: none; padding: 10px 20px; font-size: 16px; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .game-btn:hover { transform: scale(1.05); }
        .btn-easy { background-color: #00ff44; color: #111; }
        .btn-normal { background-color: #ffaa00; color: #111; }
        .btn-hard { background-color: #ff3b30; color: #fff; }
        .btn-hardcore { background-color: #9d00ff; color: #fff; box-shadow: 0 0 10px #9d00ff; }

        .status-bar { display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 18px; font-weight: bold; }
        .status-bar .score { color: #2778ff; font-size: 22px; }

        .circle-wrapper { position: relative; width: 200px; height: 200px; margin: 0 auto; }
        svg { transform: rotate(-90deg); width: 100%; height: 100%; overflow: visible; }
        .track { fill: none; stroke: #34363d; stroke-width: 10; }
        .target-zone { fill: none; stroke: #2778ff; stroke-width: 10; stroke-linecap: butt; transform-origin: 100px 100px; }
        
        .pointer-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-origin: center; will-change: transform;
        }
        .pointer {
            position: absolute; top: 10px; left: 50%; width: 4px; height: 26px; 
            background-color: #ff3b30; transform: translateX(-50%); border-radius: 2px;
        }

        .center-key-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: #34363d; width: 48px; height: 48px; border-radius: 10px; 
            display: flex; justify-content: center; align-items: center;
            font-size: 26px; font-weight: bold; color: #ececec; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .alert-text { margin-top: 25px; height: 20px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>
            <span style="color: var(--summer-orange);">🌴 SUMMER CITY</span> 
            <span style="font-size: 16px; font-weight: 400; color: #888; text-shadow: none;">| ระบบลงเวลาช่าง</span>
            <span id="loadingIndicator" class="loading-text">กำลังซิงค์...</span>
        </h1>
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchPage('time')">⏱️ ลงเวลา</button>
            <button class="tab-btn" onclick="switchPage('summary')">📊 สรุปเวลาเข้าเวร</button>
            <button class="tab-btn" onclick="switchPage('minigame')">🎮 มินิเกม</button>
        </div>
    </header>

    <div class="container">
        <!-- หน้า 1: ลงเวลา และ สถานะสด -->
        <div id="timePage" class="page active">
            <div class="card">
                <div class="header-title-container">
                    <h2 style="margin:0; border:none; padding:0;">📝 ลงเวลาปฏิบัติงาน</h2>
                </div>
                <div class="form-group">
                    <label>ชื่อ - นามสกุล (ช่าง):</label>
                    <select id="mechanicName" onchange="updateButtonState()">
                        <option value="" disabled selected>กรุณารอโหลดรายชื่อสักครู่...</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="action-btn btn-in" id="btnIn" onclick="recordTime('เข้าเวร')">เข้าเวร</button>
                    <button class="action-btn btn-out" id="btnOut" onclick="recordTime('ออกเวร')">ออกเวร</button>
                </div>
            </div>

            <div class="card">
                <div class="header-title-container">
                    <h2 style="margin:0; border:none; padding:0; color:var(--summer-green);">🟢 สถานะการเข้าเวร</h2>
                </div>
                <div class="status-container" id="statusList">
                    <div style="color: #888; text-align: center; margin-top: 30px;">กำลังโหลดสถานะ...</div>
                </div>
            </div>
        </div>

        <!-- หน้า 2: สรุปเวลาเข้าเวร -->
        <div id="summaryPage" class="page">
            <div class="card summary-card">
                <div class="header-title-container">
                    <h2 style="margin:0; border:none; padding:0;">📊 สรุปเวลาการทำงาน</h2>
                    <div style="display:flex; gap: 10px;">
                        <button class="manage-btn btn-export" onclick="exportSummary()">📤 คัดลอกสรุปส่งงาน</button>
                        <button class="manage-btn btn-reset" onclick="resetSummary()">🗑️ รีเซ็ตเวลา</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>รายชื่อช่าง</th>
                            <th>รวมเวลารายวัน</th>
                            <th>รวมเวลารายสัปดาห์</th>
                        </tr>
                    </thead>
                    <tbody id="summaryTableBody">
                        <tr><td colspan="3" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- หน้า 3: มินิเกม -->
        <div id="minigamePage" class="page">
            <div class="card summary-card" style="align-items: center; min-height: 600px;">
                <div class="header-title-container" style="width: 100%;">
                    <h2 style="margin:0; border:none; padding:0;">🎮 มินิเกมฝึกความไว</h2>
                </div>
                
                <div class="minigame-wrapper">
                    <div class="game-container">
                        <div class="overlay" id="overlay">
                            <h2 id="overlay-title">ติดตั้งอุปกรณ์</h2>
                            <p id="overlay-desc">เลือกระดับความยากเพื่อเริ่มทำรายการ</p>
                            <div class="game-btn-group" id="btn-group">
                                <button class="game-btn btn-easy" onclick="startGame('easy')">🟢 ง่าย</button>
                                <button class="game-btn btn-normal" onclick="startGame('normal')">🟡 กลาง</button>
                                <button class="game-btn btn-hard" onclick="startGame('hard')">🔴 ยาก</button>
                                <button class="game-btn btn-hardcore" onclick="startGame('hardcore')">🔥 ยากประชด!</button>
                            </div>
                        </div>

                        <div class="status-bar">
                            <span>สำเร็จ:</span>
                            <span class="score"><span id="score-text">0</span> / 10</span>
                        </div>
                        
                        <div class="circle-wrapper">
                            <svg viewBox="0 0 200 200">
                                <circle class="track" cx="100" cy="100" r="80"></circle>
                                <circle class="target-zone" id="target" cx="100" cy="100" r="80"></circle>
                            </svg>
                            <div class="pointer-container" id="pointer">
                                <div class="pointer"></div>
                            </div>
                            <div class="center-key-box" id="center-key">W</div>
                        </div>

                        <div class="alert-text" id="alert-text"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // อย่าลืมเช็ค URL ว่าเป็นอันล่าสุดที่ Deploy ใหม่ (ถ้ามี)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwdD5OWZJ39GCrc_jKgmGYeq-JCyl9JLPLvT9ieOb1Xk4pP-OlwMn5kgi0SXgjv6_qP8w/exec';

        // โหลดข้อมูลจาก Cache
        let latestData = JSON.parse(localStorage.getItem('summer_city_data')) || [];
        
        window.onload = () => {
            if (latestData.length > 0) {
                renderUI(latestData);
            }
            fetchDataFromServer(); 
            setInterval(fetchDataFromServer, 20000); 
        };

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId + 'Page').classList.add('active');
            event.target.classList.add('active');
            if(pageId === 'summary') renderSummary();
        }

        function updateButtonState() {
            const name = document.getElementById('mechanicName').value;
            const btnIn = document.getElementById('btnIn');
            const btnOut = document.getElementById('btnOut');

            if (!name) {
                btnIn.disabled = false; btnOut.disabled = false; return;
            }

            // จำชื่อที่เลือกล่าสุดลงเครื่อง รีเฟรชเว็บจะได้ไม่หลุด
            localStorage.setItem('selectedMechanic', name); 

            const user = latestData.find(u => u.name === name);
            if (user) {
                if (user.isOnline) {
                    btnIn.disabled = true; btnOut.disabled = false;
                } else {
                    btnIn.disabled = false; btnOut.disabled = true;
                }
            }
        }

        function fetchDataFromServer() {
            if (!scriptURL) return;
            document.getElementById('loadingIndicator').style.display = 'inline';

            fetch(scriptURL + '?action=getData')
                .then(response => response.json())
                .then(result => {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    if(result.status === "error") {
                        console.error('API Error:', result.message);
                        return;
                    }
                    
                    latestData = result.data;
                    localStorage.setItem('summer_city_data', JSON.stringify(latestData)); 
                    renderUI(latestData);
                })
                .catch(error => {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    console.error('Connection Error:', error);
                });
        }

        function renderUI(data) {
            const select = document.getElementById('mechanicName');
            const statusList = document.getElementById('statusList');
            
            // ดึงชื่อที่เลือกไว้ล่าสุดจาก Storage
            const currentValue = select.value || localStorage.getItem('selectedMechanic');

            // Render Select Options
            if (select.options.length <= 1 || data.length > select.options.length - 1) {
                select.innerHTML = '<option value="" disabled selected>ระบุชื่อช่าง...</option>';
                data.forEach(user => {
                    let option = document.createElement('option');
                    option.value = user.name; option.textContent = user.name;
                    select.appendChild(option);
                });
            }

            // Render Status List
            statusList.innerHTML = '';
            data.forEach(user => {
                let statusHtml = `
                    <div class="status-item">
                        <div class="user-name">${user.name}</div>
                        <div class="status-indicator">
                            <span class="status-text" style="color: ${user.isOnline ? '#00e676' : '#636e72'}">
                                ${user.isOnline ? 'On Duty' : 'Off Duty'}
                            </span>
                            <div class="dot ${user.isOnline ? 'dot-online' : 'dot-offline'}"></div>
                            ${user.isOnline ? `<span class="time-in">${user.timeInText || ''}</span>` : `<span class="time-in" style="opacity: 0">00:00</span>`}
                        </div>
                    </div>
                `;
                statusList.insertAdjacentHTML('beforeend', statusHtml);
            });

            // คืนค่าที่เลือกล่าสุดและล็อคปุ่ม
            if(currentValue) {
                select.value = currentValue;
                updateButtonState(); 
            }
            if(document.getElementById('summaryPage').classList.contains('active')) renderSummary();
        }

        function renderSummary() {
            const tbody = document.getElementById('summaryTableBody');
            tbody.innerHTML = '';
            
            if (latestData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">ไม่มีข้อมูล</td></tr>';
                return;
            }

            latestData.forEach(user => {
                let html = `
                    <tr>
                        <td style="font-weight:bold; color:#fff;">${user.name}</td>
                        <td style="color: var(--summer-blue); font-weight: 600;">${user.todayText}</td>
                        <td style="color: var(--summer-orange); font-weight: 600;">${user.weekText}</td>
                    </tr>
                `;
                tbody.innerHTML += html;
            });
        }

        function recordTime(actionType) {
            const name = document.getElementById('mechanicName').value;
            if (!name) return alert('กรุณาเลือกชื่อก่อนบันทึกเวลา');

            document.getElementById('btnIn').disabled = true;
            document.getElementById('btnOut').disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ name: name, action: actionType })
            })
            .then(response => response.json())
            .then(data => {
                alert((data.status === 'success' ? '✅ ' : '⚠️ ') + data.msg);
                if(data.status === 'success') {
                    
                    // อัปเดต Cache ของเครื่องทันที ป้องกันรีเฟรชแล้วปุ่มหลุด
                    let user = latestData.find(u => u.name === name);
                    if(user) {
                        user.isOnline = (actionType === 'เข้าเวร');
                        // ให้แสดงคำว่าซิงค์ระหว่างรอเวลาจริงจากเซิร์ฟเวอร์
                        user.timeInText = actionType === 'เข้าเวร' ? "ซิงค์..." : "";
                        localStorage.setItem('summer_city_data', JSON.stringify(latestData));
                        renderUI(latestData);
                    }

                    // หน่วงเวลา 2 วินาทีให้ Google Sheet ประมวลผลและเซฟข้อมูลเสร็จ ค่อยดึงเวลาจริงมาแสดง
                    setTimeout(fetchDataFromServer, 2000); 
                } else {
                    updateButtonState(); 
                }
            })
            .catch(err => {
                console.error(err);
                alert('❌ เกิดข้อผิดพลาดในการส่งข้อมูล');
                updateButtonState();
            });
        }

        function exportSummary() {
            if (latestData.length === 0) return alert("ไม่มีข้อมูลให้คัดลอกครับ");
            
            let textOutput = "📊 สรุปเวลาเข้าเวร\n\n";
            latestData.forEach(user => {
                textOutput += `ช่าง: ${user.name}\n`;
                textOutput += `รวมเวลารายวัน: ${user.todayText}\n`;
                textOutput += `รวมเวลารายสัปดาห์: ${user.weekText}\n`;
                textOutput += `----------------------\n`;
            });

            navigator.clipboard.writeText(textOutput).then(() => {
                alert("📋 คัดลอกข้อมูลสรุปเวลาเรียบร้อยแล้ว!");
            }).catch(err => alert("❌ เกิดข้อผิดพลาดในการคัดลอก: " + err));
        }

        function resetSummary() {
            const password = prompt("⚠️ คำเตือน: ข้อมูลจะถูกลบทิ้งทั้งหมด!\nกรุณาใส่รหัสผ่านเพื่อยืนยัน:");
            if (password === "Kapi0625") {
                if (confirm("แน่ใจไหมว่าจะล้างข้อมูลทั้งหมด?")) {
                    fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: 'resetData' }) })
                    .then(response => response.json())
                    .then(data => { alert(data.msg); fetchDataFromServer(); })
                    .catch(error => alert('❌ เกิดข้อผิดพลาด'));
                }
            } else if (password !== null) {
                alert("❌ รหัสผ่านไม่ถูกต้อง!");
            }
        }

        // ================= JS สำหรับมินิเกม =================

        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            if (type === 'success') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'fail') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            }
        }

        // --- ระบบเกม ---
        const keys = ['W', 'A', 'S', 'D'];
        const totalRounds = 10; 
        const timePerRevolution = 1100; 
        const hitBuffer = 6; 

        let currentMode = 'easy';
        let lagTriggers = [];
        let currentLagIndex = 0;
        let isLagging = false;
        let lagStartTime = 0;
        let currentLagDuration = 0;
        let totalLagOffset = 0;

        let willWarp = false;
        let warpTriggerAngle = 0;
        let warpAmount = 0;
        let hasWarped = false;

        let score = 0;
        let isPlaying = false;
        let animationFrame;
        let startTime = 0;
        let currentAngle = 0;
        let targetStartAngle = 0;
        let targetEndAngle = 0;
        let currentTargetKey = '';

        const radius = 80;
        const circumference = 2 * Math.PI * radius; 

        const targetEl = document.getElementById('target');
        const pointerEl = document.getElementById('pointer');
        const centerKeyEl = document.getElementById('center-key');
        const scoreText = document.getElementById('score-text');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const alertText = document.getElementById('alert-text');

        function startGame(mode) {
            initAudio();
            currentMode = mode;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            overlay.style.display = 'none';
            score = 0;
            scoreText.textContent = score;
            alertText.textContent = '';
            targetEl.style.stroke = '#2778ff'; 
            
            startRound();
        }

        function startRound() {
            if (score >= totalRounds) {
                playSound('win');
                endGame(true, "ติดตั้งสำเร็จเรียบร้อย!");
                return;
            }

            currentTargetKey = keys[Math.floor(Math.random() * keys.length)];
            centerKeyEl.textContent = currentTargetKey;

            const widthBase = 25; 
            const targetWidthDegrees = Math.floor(Math.random() * 11) + widthBase; 
            
            const minStartAngle = 140; 
            const maxStartAngle = 360 - targetWidthDegrees - 15;

            targetStartAngle = Math.floor(Math.random() * (maxStartAngle - minStartAngle)) + minStartAngle;
            targetEndAngle = targetStartAngle + targetWidthDegrees;

            const targetLength = (targetWidthDegrees / 360) * circumference;
            targetEl.style.strokeDasharray = `${targetLength} ${circumference}`;
            targetEl.style.strokeDashoffset = `0`;
            targetEl.style.transform = `rotate(${targetStartAngle}deg)`;

            lagTriggers = [];
            willWarp = false;
            hasWarped = false;
            let lagCount = 0;

            if (currentMode === 'normal') {
                if (Math.random() < 0.6) lagCount = Math.floor(Math.random() * 3) + 1; 
            } else if (currentMode === 'hard') {
                lagCount = Math.floor(Math.random() * 4) + 2; 
            } else if (currentMode === 'hardcore') {
                lagCount = Math.floor(Math.random() * 4) + 3; 
                willWarp = Math.random() < 0.6; 
            }

            for (let i = 0; i < lagCount; i++) {
                let maxAngle = targetStartAngle - 20;
                let minAngle = 15;
                if (maxAngle <= minAngle) maxAngle = minAngle + 10;
                
                let angle = Math.floor(Math.random() * (maxAngle - minAngle)) + minAngle;
                let duration = Math.floor(Math.random() * 150) + 50; 
                if (currentMode === 'hardcore') duration += 120; 
                lagTriggers.push({angle, duration});
            }
            lagTriggers.sort((a, b) => a.angle - b.angle); 

            if (willWarp) {
                warpTriggerAngle = Math.floor(Math.random() * (targetStartAngle - 80)) + 40;
                const maxWarp = targetStartAngle - warpTriggerAngle - 5;
                warpAmount = Math.min(Math.floor(Math.random() * 40) + 25, maxWarp); 
                if (warpAmount < 15) willWarp = false; 
            }

            isLagging = false;
            currentLagIndex = 0;
            totalLagOffset = 0;

            currentAngle = 0;
            pointerEl.style.transform = `rotate(0deg)`;
            targetEl.style.stroke = '#2778ff';
            
            isPlaying = true;
            startTime = performance.now();
            
            cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(update);
        }

        function update(currentTime) {
            if (!isPlaying) return;

            if (isLagging) {
                if (currentTime - lagStartTime >= currentLagDuration) {
                    isLagging = false;
                    let compensation = currentMode === 'hardcore' ? 0.7 : 1.0;
                    totalLagOffset += (currentTime - lagStartTime) * compensation; 
                    currentLagIndex++;
                } else {
                    animationFrame = requestAnimationFrame(update);
                    return; 
                }
            }

            let elapsedTime = currentTime - startTime - totalLagOffset;
            currentAngle = (elapsedTime / timePerRevolution) * 360;

            if (willWarp && !hasWarped && currentAngle >= warpTriggerAngle) {
                hasWarped = true;
                const warpTimeSkip = (warpAmount / 360) * timePerRevolution;
                totalLagOffset -= warpTimeSkip; 
                elapsedTime = currentTime - startTime - totalLagOffset;
                currentAngle = (elapsedTime / timePerRevolution) * 360;
            }

            if (currentLagIndex < lagTriggers.length && !isLagging) {
                if (currentAngle >= lagTriggers[currentLagIndex].angle) {
                    isLagging = true;
                    lagStartTime = currentTime;
                    currentLagDuration = lagTriggers[currentLagIndex].duration;
                    currentAngle = lagTriggers[currentLagIndex].angle; 
                    pointerEl.style.transform = `rotate(${currentAngle}deg)`;
                    animationFrame = requestAnimationFrame(update);
                    return;
                }
            }

            if (currentAngle >= 360) {
                currentAngle = 360;
                pointerEl.style.transform = `rotate(360deg)`;
                playSound('fail'); 
                handleFail("พลาด! หมดเวลา");
                return;
            }

            pointerEl.style.transform = `rotate(${currentAngle}deg)`;
            animationFrame = requestAnimationFrame(update);
        }

        document.addEventListener('keydown', (e) => {
            if (!isPlaying || document.getElementById('minigamePage').classList.contains('active') === false) return;
            
            const thaiToEngMap = {
                'ไ': 'W', 'ฟ': 'A', 'ห': 'S', 'ก': 'D',
                '"': 'W', 'ฤ': 'A', 'ฆ': 'S', 'ฏ': 'D' 
            };

            let pressedKey = e.key;
            if (thaiToEngMap[pressedKey]) {
                pressedKey = thaiToEngMap[pressedKey];
            } else {
                pressedKey = pressedKey.toUpperCase();
            }

            if (!keys.includes(pressedKey)) return;

            isPlaying = false;
            cancelAnimationFrame(animationFrame);

            const exactClickTime = performance.now();
            let finalTime = exactClickTime - startTime - totalLagOffset;
            
            if (isLagging) {
                finalTime -= (exactClickTime - lagStartTime);
            }

            currentAngle = (finalTime / timePerRevolution) * 360;
            if (currentAngle > 360) currentAngle = 360;

            pointerEl.style.transform = `rotate(${currentAngle}deg)`;

            const isInsideZone = currentAngle >= (targetStartAngle - hitBuffer) && currentAngle <= (targetEndAngle + hitBuffer);
            const isCorrectKey = pressedKey === currentTargetKey;

            if (isInsideZone && isCorrectKey) {
                playSound('success');
                score++;
                scoreText.textContent = score;
                targetEl.style.stroke = '#00ff44'; 

                setTimeout(() => {
                    startRound();
                }, 150);
            } else {
                playSound('fail');
                if (!isInsideZone) {
                    handleFail("พลาด! หยุดไม่ตรงเป้า");
                } else {
                    handleFail(`พลาด! กดผิดปุ่ม (ต้องกด ${currentTargetKey})`);
                }
            }
        });

        function handleFail(reason) {
            isPlaying = false;
            cancelAnimationFrame(animationFrame);
            targetEl.style.stroke = '#ff3b30'; 
            
            setTimeout(() => {
                endGame(false, reason);
            }, 500);
        }

        function endGame(isWin, message) {
            overlay.style.display = 'flex';
            overlayTitle.innerHTML = isWin ? "🎉 สำเร็จ!" : "❌ ล้มเหลว!";
            overlayTitle.style.color = isWin ? '#00ff44' : '#ff3b30';
            overlayDesc.textContent = message;
        }
    </script>
</body>
