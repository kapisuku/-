<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงเวลาปฏิบัติงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* กล่องหลัก แบ่งซ้าย-ขวา */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 90%;
            max-width: 850px;
        }

        .card {
            background-color: #222232;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #333344;
            flex: 1;
            min-width: 300px;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid #333344;
            padding-bottom: 15px;
            margin-bottom: 20px;
            color: #fff;
        }

        /* ฟอร์มด้านซ้าย */
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b0c0;
        }
        select {
            width: 100%;
            padding: 12px;
            background-color: #161622;
            border: 1px solid #4a4a6a;
            border-radius: 8px;
            color: #fff;
            font-family: 'Kanit', sans-serif;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            appearance: none;
            cursor: pointer;
        }
        select:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.5);
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: 'Kanit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-in { background-color: #00b894; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3); }
        .btn-in:hover { background-color: #019e7f; transform: translateY(-2px); }
        .btn-out { background-color: #d63031; box-shadow: 0 4px 15px rgba(214, 48, 49, 0.3); }
        .btn-out:hover { background-color: #b82929; transform: translateY(-2px); }
        button:disabled { filter: grayscale(1); cursor: not-allowed; transform: none; }

        /* รายชื่อสถานะด้านขวา */
        .status-container {
            max-height: 250px;
            overflow-y: auto;
            padding-right: 10px;
        }
        /* แต่ง Scrollbar */
        .status-container::-webkit-scrollbar { width: 6px; }
        .status-container::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 4px; }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid #2a2a3e;
            font-size: 15px;
            color: #eaeaea;
        }
        .status-item:last-child { border-bottom: none; }
        
        .status-dot-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-online {
            background-color: #00e676;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.6);
        }
        .dot-offline {
            background-color: #636e72;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- ฝั่งซ้าย: ลงเวลา -->
        <div class="card">
            <h2>ลงเวลาปฏิบัติงาน</h2>
            <div class="form-group">
                <label>ชื่อ - นามสกุล (ช่าง):</label>
                <select id="mechanicName">
                    <option value="" disabled selected>กำลังโหลดข้อมูล...</option>
                </select>
            </div>
            <div class="btn-group">
                <button class="btn-in" id="btnIn" onclick="recordTime('เข้าเวร')">เข้าเวร</button>
                <button class="btn-out" id="btnOut" onclick="recordTime('ออกเวร')">ออกเวร</button>
            </div>
        </div>

        <!-- ฝั่งขวา: สถานะ -->
        <div class="card">
            <h2>สถานะการเข้าเวร</h2>
            <div class="status-container" id="statusList">
                <div style="color: #888; text-align: center; margin-top: 20px;">กำลังโหลดสถานะ...</div>
            </div>
        </div>
    </div>

    <script>
        // อัปเดต Web App URL ใหม่ของคุณที่นี่
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyHQ_jiKXG_7-4FFKWTvvs2O1kx8s0vAdreIWZSQop8vln7quCTxkjsv5AlZL8tXz8cdA/exec';

        // โหลดข้อมูลเมื่อเปิดเว็บ
        window.onload = loadData;

        function loadData() {
            fetch(scriptURL + '?action=getData')
                .then(response => response.json())
                .then(result => {
                    const data = result.data;
                    const select = document.getElementById('mechanicName');
                    const statusList = document.getElementById('statusList');
                    
                    const currentValue = select.value;

                    select.innerHTML = '<option value="" disabled selected>ระบุชื่อช่าง...</option>';
                    statusList.innerHTML = '';

                    data.forEach(user => {
                        // เพิ่มรายชื่อใน Dropdown
                        let option = document.createElement('option');
                        option.value = user.name;
                        option.textContent = user.name;
                        select.appendChild(option);

                        // สร้างรายการโชว์สถานะด้านขวา
                        let statusHtml = `
                            <div class="status-item">
                                <span>${user.name}</span>
                                <div class="status-dot-wrapper">
                                    <span style="color: ${user.isOnline ? '#00e676' : '#636e72'}">${user.isOnline ? 'On Duty' : 'Off Duty'}</span>
                                    <div class="dot ${user.isOnline ? 'dot-online' : 'dot-offline'}"></div>
                                </div>
                            </div>
                        `;
                        statusList.insertAdjacentHTML('beforeend', statusHtml);
                    });

                    if(currentValue) select.value = currentValue;
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('statusList').innerHTML = '<div style="color: #d63031; text-align: center;">โหลดข้อมูลล้มเหลว</div>';
                });
        }

        function recordTime(actionType) {
            const name = document.getElementById('mechanicName').value;
            
            if (!name) {
                alert('กรุณาเลือกชื่อก่อนบันทึกเวลา');
                return;
            }

            document.getElementById('btnIn').disabled = true;
            document.getElementById('btnOut').disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ name: name, action: actionType })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('✅ ' + data.msg);
                    loadData();
                } else {
                    alert('⚠️ ' + data.msg); 
                }
            })
            .catch(error => {
                alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อกับระบบ');
                console.error('Error:', error);
            })
            .finally(() => {
                document.getElementById('btnIn').disabled = false;
                document.getElementById('btnOut').disabled = false;
            });
        }
    </script>
</body>
</html>
