<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงเวลาปฏิบัติงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: stretch; 
            height: 100vh;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            width: 100%;
            max-width: 1600px;
        }

        .card {
            background-color: #222232;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #333344;
            flex: 1;
            min-width: 450px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin-top: 0;
            font-size: 28px;
            border-bottom: 2px solid #333344;
            padding-bottom: 20px;
            margin-bottom: 30px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 12px;
            font-size: 18px;
            color: #b0b0c0;
        }
        select {
            width: 100%;
            padding: 18px;
            background-color: #161622;
            border: 1px solid #4a4a6a;
            border-radius: 12px;
            color: #fff;
            font-family: 'Kanit', sans-serif;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
            appearance: none;
            cursor: pointer;
        }
        select:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 15px rgba(108, 92, 231, 0.5);
        }

        .btn-group {
            display: flex;
            gap: 20px;
        }
        button {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-family: 'Kanit', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-in { background-color: #00b894; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3); }
        .btn-in:hover { background-color: #019e7f; transform: translateY(-3px); }
        .btn-out { background-color: #d63031; box-shadow: 0 4px 15px rgba(214, 48, 49, 0.3); }
        .btn-out:hover { background-color: #b82929; transform: translateY(-3px); }
        button:disabled { filter: grayscale(1); cursor: not-allowed; transform: none; }

        .status-container {
            flex: 1; 
            overflow-y: auto;
            padding-right: 15px;
        }
        .status-container::-webkit-scrollbar { width: 8px; }
        .status-container::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 6px; }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            border-bottom: 1px solid #2a2a3e;
        }
        .status-item:last-child { border-bottom: none; }
        
        .user-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .user-name {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
        }
        .user-stats {
            font-size: 15px;
            color: #a0a0b5;
        }
        .user-stats span {
            color: #e0e0e0;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-text {
            font-size: 18px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }
        .dot-online {
            background-color: #00e676;
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.7);
        }
        .dot-offline {
            background-color: #636e72;
        }
        .time-in {
            font-size: 18px;
            color: #00e676;
            font-weight: 600;
            min-width: 55px; 
            text-align: right;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- ฝั่งซ้าย: ลงเวลา -->
        <div class="card">
            <h2>ลงเวลาปฏิบัติงาน</h2>
            <div class="form-group">
                <label>ชื่อ - นามสกุล (ช่าง):</label>
                <select id="mechanicName">
                    <option value="" disabled selected>กำลังโหลดข้อมูล...</option>
                </select>
            </div>
            <div class="btn-group">
                <button class="btn-in" id="btnIn" onclick="recordTime('เข้าเวร')">เข้าเวร</button>
                <button class="btn-out" id="btnOut" onclick="recordTime('ออกเวร')">ออกเวร</button>
            </div>
        </div>

        <!-- ฝั่งขวา: สถานะ -->
        <div class="card">
            <h2>สถานะการเข้าเวร</h2>
            <div class="status-container" id="statusList">
                <div style="color: #888; text-align: center; margin-top: 30px; font-size: 18px;">กำลังโหลดสถานะ...</div>
            </div>
        </div>
    </div>

    <script>
        // 📌 Web App URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwysn-lkU26fnwXO1kHhq4J3SuYh5lop60E5t-60HOIXizQqBnOmjmlX1nbI1Ph1aUWIA/exec';

        // โหลดข้อมูลเมื่อเปิดเว็บ
        window.onload = loadData;

        // อัปเดตข้อมูลอัตโนมัติทุกๆ 30 วินาที
        setInterval(loadData, 30000);

        function loadData() {
            if (!scriptURL || scriptURL === 'ใส่_URL_อันใหม่ล่าสุด_ตรงนี้') {
                document.getElementById('statusList').innerHTML = '<div style="color: #f39c12; text-align: center; margin-top: 30px;">⚠️ กรุณาใส่ Web App URL ในโค้ดก่อนครับ</div>';
                return;
            }

            fetch(scriptURL + '?action=getData')
                .then(response => response.json())
                .then(result => {
                    const data = result.data;
                    const select = document.getElementById('mechanicName');
                    const statusList = document.getElementById('statusList');
                    
                    const currentValue = select.value;

                    // ป้องกันการรีเฟรช Dropdown ถ้ามีคนกำลังกดเลือกชื่ออยู่
                    if (select.options.length <= 1) {
                        select.innerHTML = '<option value="" disabled selected>ระบุชื่อช่าง...</option>';
                        data.forEach(user => {
                            let option = document.createElement('option');
                            option.value = user.name;
                            option.textContent = user.name;
                            select.appendChild(option);
                        });
                    }

                    // สร้าง UI สถานะ
                    statusList.innerHTML = '';
                    data.forEach(user => {
                        let statusHtml = `
                            <div class="status-item">
                                <div class="user-info">
                                    <div class="user-name">${user.name}</div>
                                    <div class="user-stats">
                                        รายวัน: <span>${user.todayText}</span> | รายสัปดาห์: <span>${user.weekText}</span>
                                    </div>
                                </div>
                                <div class="status-indicator">
                                    <span class="status-text" style="color: ${user.isOnline ? '#00e676' : '#636e72'}">
                                        ${user.isOnline ? 'เข้าเวรอยู่' : 'ออกเวรอยู่'}
                                    </span>
                                    <div class="dot ${user.isOnline ? 'dot-online' : 'dot-offline'}"></div>
                                    ${user.isOnline ? `<span class="time-in">${user.timeInText}</span>` : `<span class="time-in" style="opacity: 0">00:00</span>`}
                                </div>
                            </div>
                        `;
                        statusList.insertAdjacentHTML('beforeend', statusHtml);
                    });

                    if(currentValue) select.value = currentValue;
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('statusList').innerHTML = '<div style="color: #d63031; text-align: center; margin-top: 30px;">❌ โหลดข้อมูลล้มเหลว (เช็ค URL หรือสิทธิ์การเข้าถึง)</div>';
                });
        }

        function recordTime(actionType) {
            const name = document.getElementById('mechanicName').value;
            
            if (!name) {
                alert('กรุณาเลือกชื่อก่อนบันทึกเวลา');
                return;
            }

            document.getElementById('btnIn').disabled = true;
            document.getElementById('btnOut').disabled = true;

            fetch(scriptURL, {
                method: 'POST',
                body: JSON.stringify({ name: name, action: actionType })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('✅ ' + data.msg);
                    loadData();
                } else {
                    alert('⚠️ ' + data.msg); 
                }
            })
            .catch(error => {
                alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อกับระบบ');
                console.error('Error:', error);
            })
            .finally(() => {
                document.getElementById('btnIn').disabled = false;
                document.getElementById('btnOut').disabled = false;
            });
        }
    </script>
</body>
</html>
